<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Election Results</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>🔐 Admin Panel</h1>
        <p>College Election 2026</p>
    </header>


    <!-- PIN LOGIN -->
    <section id="pinSection" class="card">

        <h2>Admin Security</h2>

        <p style="text-align:center;">
            Enter Security PIN to open election results
        </p>

        <input
            type="password"
            id="securityPin"
            placeholder="Enter Security PIN"
            maxlength="6"
        >

        <button onclick="checkPin()">
            🔓 Open Admin Panel
        </button>

        <p id="pinMessage"
           style="text-align:center; margin-top:15px;">
        </p>

    </section>


    <!-- ADMIN RESULTS -->
    <section id="adminSection" class="card hidden">

        <h2>📊 Election Results</h2>

        <div id="results"></div>

        <button onclick="refreshResults()">
            🔄 Refresh Results
        </button>

        <button onclick="clearVotes()">
            🗑️ Reset Election Data
        </button>

        <button onclick="logout()">
            🚪 Logout
        </button>

    </section>

</div>


<script>

// ================================
// ADMIN SECURITY PIN
// ================================

// Change this PIN for your project
const ADMIN_PIN = "123456";


// ================================
// CHECK PIN
// ================================

function checkPin() {

    const enteredPin =
        document.getElementById("securityPin").value;

    const message =
        document.getElementById("pinMessage");


    if (enteredPin === ADMIN_PIN) {

        // Hide PIN screen
        document.getElementById(
            "pinSection"
        ).classList.add("hidden");


        // Show admin panel
        document.getElementById(
            "adminSection"
        ).classList.remove("hidden");


        message.innerText = "";

        displayResults();

    } else {

        message.style.color = "red";

        message.innerText =
            "❌ Incorrect Security PIN";

    }
}


// ================================
// DISPLAY RESULTS
// ================================

function displayResults() {

    const votes =
        JSON.parse(
            localStorage.getItem("collegeVotes")
        ) || {

            "Candidate 1": 0,
            "Candidate 2": 0,
            "Candidate 3": 0
        };


    let totalVotes = 0;


    Object.values(votes).forEach(
        vote => {
            totalVotes += vote;
        }
    );


    let html = "";


    for (const candidate in votes) {

        html += `
            <div class="candidate">

                <div>

                    <h3>${candidate}</h3>

                    <p>
                        Votes:
                        <strong>
                            ${votes[candidate]}
                        </strong>
                    </p>

                </div>

            </div>
        `;
    }


    html += `
        <h3 style="text-align:center; margin-top:20px;">
            Total Votes: ${totalVotes}
        </h3>
    `;


    document.getElementById(
        "results"
    ).innerHTML = html;
}


// ================================
// REFRESH RESULTS
// ================================

function refreshResults() {

    displayResults();

}


// ================================
// RESET VOTES
// ================================

function clearVotes() {

    const confirmReset =
        confirm(
            "Are you sure you want to reset all election data?"
        );


    if (confirmReset) {

        localStorage.removeItem(
            "collegeVotes"
        );

        localStorage.removeItem(
            "votedStudents"
        );


        displayResults();


        alert(
            "Election data has been reset."
        );
    }
}


// ================================
// LOGOUT
// ================================

function logout() {

    document.getElementById(
        "adminSection"
    ).classList.add("hidden");


    document.getElementById(
        "pinSection"
    ).classList.remove("hidden");


    document.getElementById(
        "securityPin"
    ).value = "";

}
</script>

</body>
</html>
